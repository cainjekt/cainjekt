apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
- rbac.yaml
- daemonset.yaml

# daemonset.yaml uses the placeholder image name `cainjekt` for both the plugin
# and the initContainer (`cainjekt install`). `latest` tracks main; release
# manifests (GitHub releases) pin the release tag. Pin newTag for production.
images:
- name: cainjekt
  newName: ghcr.io/cainjekt/cainjekt
  newTag: latest
