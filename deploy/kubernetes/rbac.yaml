# The plugin talks to containerd over the NRI socket only and never calls the
# Kubernetes API, so the ServiceAccount has no (Cluster)Role bindings and the
# DaemonSet does not mount its token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cainjekt
  namespace: kube-system
  labels:
    app: cainjekt
automountServiceAccountToken: false
