name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KIND_VERSION: v0.31.0
  KUBECTL_VERSION: v1.35.0
  CLUSTER_NAME: cainjekt-test-cluster

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Keep in sync with the v2 config format in .golangci.yml.
          version: v2.15.0
          # Also lint the kind-based tests behind the integration build tag.
          args: --build-tags=integration

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet -tags=integration ./...

      - name: Unit tests
        run: go test ./...

  kind:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: integration
            target: integration-test
          - name: e2e
            target: e2e-test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          curl -fsSL -o ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Verify toolchain
        run: |
          go version
          docker version
          kubectl version --client
          make --version | head -n 1

      - name: Create kind cluster
        run: make prepare-test-cluster CLUSTER_NAME="${CLUSTER_NAME}"

      - name: Run ${{ matrix.name }} tests
        run: make "${{ matrix.target }}" CLUSTER_NAME="${CLUSTER_NAME}"

      - name: Collect debug info on failure
        if: failure()
        run: |
          echo "::group::Nodes"
          kubectl get nodes -o wide || true
          echo "::endgroup::"
          echo "::group::Pods (all namespaces)"
          kubectl get pods -A -o wide || true
          echo "::endgroup::"
          echo "::group::cainjekt DaemonSet"
          kubectl get daemonset -n kube-system cainjekt -o wide || true
          kubectl describe daemonset -n kube-system cainjekt || true
          echo "::endgroup::"
          echo "::group::cainjekt pods"
          kubectl describe pods -n kube-system -l app=cainjekt || true
          kubectl logs -n kube-system -l app=cainjekt --tail=200 --all-containers=true --prefix=true || true
          echo "::endgroup::"
          echo "::group::Non-system pods"
          for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            case "$ns" in kube-system|kube-public|kube-node-lease|local-path-storage) continue ;; esac
            for pod in $(kubectl get pods -n "$ns" -o name 2>/dev/null); do
              echo "--- ${ns}/${pod}"
              kubectl describe -n "$ns" "$pod" || true
              kubectl logs -n "$ns" "$pod" --all-containers=true --tail=100 || true
            done
          done
          echo "::endgroup::"
          echo "::group::Events"
          kubectl get events -A --sort-by=.metadata.creationTimestamp | tail -50 || true
          echo "::endgroup::"
          echo "::group::containerd logs (kind nodes)"
          for node in $(kind get nodes --name "${CLUSTER_NAME}" 2>/dev/null); do
            echo "--- ${node}"
            docker exec "${node}" journalctl -u containerd --no-pager -n 200 || true
          done
          echo "::endgroup::"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: cainjekt:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build installer Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: installer
          load: true
          push: false
          tags: cainjekt-installer:ci-test
          cache-from: type=gha

      - name: Test Docker images
        run: |
          docker run --rm cainjekt:ci-test --help || true
          docker inspect cainjekt:ci-test --format='{{.Config.Entrypoint}}'
          docker inspect cainjekt:ci-test --format='Size: {{.Size}} bytes'
          docker inspect cainjekt-installer:ci-test --format='Size: {{.Size}} bytes'
