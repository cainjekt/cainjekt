name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind
        run: |
          curl -fsSL -o ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.35.0

      - name: Verify toolchain
        run: |
          go version
          docker version
          kubectl version --client
          make --version | head -n 1

      - name: Unit tests
        run: go test ./...

      - name: Integration tests
        run: make integration-test

      - name: E2E tests
        run: make e2e-test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: cainjekt:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm cainjekt:ci-test --help || true
          docker inspect cainjekt:ci-test --format='{{.Config.Entrypoint}}'
          docker inspect cainjekt:ci-test --format='Size: {{.Size}} bytes'
          # The initContainer runs `cainjekt install`; smoke-test it with a
          # read-only root filesystem and no capabilities, as in the DaemonSet.
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /host/opt/cainjekt cainjekt:ci-test install --dest /host/opt/cainjekt/bin/cainjekt

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Lint chart
        run: helm lint charts/cainjekt

      - name: Render chart
        run: |
          printf -- '-----BEGIN CERTIFICATE-----\nMIIB\n-----END CERTIFICATE-----\n' > /tmp/ca.pem
          helm template cainjekt charts/cainjekt -n kube-system > /dev/null
          helm template cainjekt charts/cainjekt -n kube-system \
            --set caBundle.source=inline --set-file caBundle.inline=/tmp/ca.pem > /dev/null
          helm template cainjekt charts/cainjekt -n kube-system \
            --set caBundle.source=clusterTrustBundle \
            --set caBundle.clusterTrustBundle.signerName=example.com/org \
            --set caBundle.clusterTrustBundle.labelSelector.matchLabels.trust=org > /dev/null
          helm template cainjekt charts/cainjekt -n kube-system \
            --set httpServer.enabled=true \
            --set probes.liveness.enabled=true --set probes.readiness.enabled=true \
            --set metrics.serviceMonitor.enabled=true > /dev/null
          # Invalid combinations must fail.
          for args in "--set caBundle.source=clusterTrustBundle" \
                      "--set probes.readiness.enabled=true" \
                      "--set hookTimeoutSec=500"; do
            if helm template cainjekt charts/cainjekt $args > /dev/null 2>&1; then
              echo "expected failure: $args"; exit 1
            fi
          done

      - name: Render kustomize manifests
        run: kubectl kustomize deploy/kubernetes > /dev/null
