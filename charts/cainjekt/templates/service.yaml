{{- if and (include "cainjekt.httpEnabled" .) (or .Values.metrics.service.enabled .Values.metrics.serviceMonitor.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cainjekt.fullname" . }}-metrics
  namespace: {{ include "cainjekt.namespace" . }}
  labels:
    {{- include "cainjekt.labels" . | nindent 4 }}
  {{- with .Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "cainjekt.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.httpServer.port }}
      targetPort: http
      protocol: TCP
{{- end }}
