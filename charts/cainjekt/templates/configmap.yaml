{{- if eq (include "cainjekt.caSource" .) "inline" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cainjekt.caBundleConfigMapName" . }}
  namespace: {{ include "cainjekt.namespace" . }}
  labels:
    {{- include "cainjekt.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  ca-bundle.pem: |
    {{- .Values.caBundle.inline | trim | nindent 4 }}
{{- end }}
